name: Deploy Student Performance App to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: parth-student-score-06110006
  AZURE_RESOURCE_GROUP: rg-gempriceprediction
  PYTHON_VERSION: "3.11"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall app.py src

      - name: Install dependencies into deployment package
        run: |
          mkdir -p .python_packages/lib/site-packages
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Create deployment package
        run: |
          zip -r release.zip . \
            -x ".git/*" \
            -x "venv/*" \
            -x ".venv/*" \
            -x "**/__pycache__/*" \
            -x "*.pyc" \
            -x ".pytest_cache/*" \
            -x "release.zip"

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure App Service
        run: |
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --linux-fx-version "PYTHON|$PYTHON_VERSION" \
            --startup-file "python -m gunicorn --bind=0.0.0.0 --timeout 600 app:app"
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false PYTHONPATH=/home/site/wwwroot/.python_packages/lib/site-packages:/home/site/wwwroot

      - name: Deploy to Azure App Service
        id: deploy-to-webapp
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path release.zip \
            --type zip \
            --restart true \
            --async true

      - name: Verify deployed app
        run: |
          sleep 210
          curl --retry 12 --retry-all-errors --retry-delay 10 --max-time 30 \
            --fail "https://${AZURE_WEBAPP_NAME}.azurewebsites.net/predictdata" \
            --output /tmp/azure-healthcheck.html
